<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/css/dashboard.css">
    <!-- Cashfree -->
    <script src="https://sdk.cashfree.com/js/ui/2.0.0/cashfree.sandbox.js"></script>

</head>


<body>

   <!-- Navbar -->
    <nav class="navbar">

        <span class="navbar-title">
            Expense Tracker
        </span>
        &nbsp;
        <button class="get-premium-btn">
            Get Premium
        </button>

        <span class="navbar-user">
            <span id="userName"></span>
        </span>

        <button id="logoutBtn" onclick="logout()">
            Logout
        </button>

    </nav>


    <!-- Dashboard -->
    <div class="dashboard">


        <!-- ADD EXPENSE CARD -->
        <div class="card form-card">

            <h1>Add Expense</h1>

            <p class="sub">Track your daily spending.</p>
            <form id="expenseForm" novalidate>
                <!-- Amount -->
                <div class="field">

                    <label for="amount">Amount</lael>

                    <input type="number" id="amount" name="amount" placeholder="e.g. 250" min="0" step="0.01">

                    <div class="error-msg" id="amountError"></div>

                </div>


                <!-- Description -->

                <div class="field">

                    <label for="description">Description</label>

                    <input type="text" id="description" name="description" placeholder="e.g. Groceries">

                    <div class="error-msg" id="descriptionError"></div>

                </div>


                <!-- Category -->

                <div class="field">

                    <label for="category">Category</label>

                    <select id="category" name="category">

                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>

                    </select>


                    <div class="error-msg" id="categoryError"></div>

                </div>
                <button type="submit"id="submitBtn">Add Expense</button>

            </form>

        </div>



        <!-- EXPENSE LIST CARD -->
        <div class="card list-card">

            <h1>Today's Expenses</h1>

            <p class="sub" id="totalText">Total: ₹0.00</p>


            <!-- Expense List -->
            <ul id="expenseList" class="expense-list">
                <li class="empty-state" id="emptyState">
                    No expenses added yet.
                </li>

            </ul>


            <!-- PAGINATION-->

            <div class="pagination">


                <!-- Rows Per Page -->
                <div class="pagination-left">

                    <span>
                        Rows per page:
                    </span>

                    <select id="expensesPerPage">

                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>

                    </select>

                </div>


                <!-- Page Navigation -->
                <div class="pagination-right">

                    <span id="paginationInfo">
                        0-0 of 0
                    </span>


                    <button id="prevPageBtn" disabled type="button">‹</button>
                    <button id="nextPageBtn" disabled type="button">›</button>

                </div>

            </div>

        </div>

    </div>


    <!-- Dashboard JavaScript -->
    <script src="/js/dashboard.js"></script>

</body>

</html>
